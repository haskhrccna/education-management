appId: com.quranreview.app
tags: [auth, smoke]
---
- clearKeychain
- launchApp:
    clearState: true
# wrong password → error box
- runFlow:
    file: ../_helpers/login.yaml
    env:
      EMAIL: ali@quran-review.com
      PASSWORD: WrongPass1!
- extendedWaitUntil:
    visible:
      id: "login.error"
    timeout: 10000
# the password field still holds focus after the failed submit; the keyboard
# covers the below-the-fold forgot/register links so tapOn resolves to the
# keyboard instead of the link underneath it unless it's dismissed first.
- hideKeyboard
# links work
- tapOn:
    id: "login.forgot-link"
# iOS's "Save Password?" Keychain prompt can surface after the screen
# transition settles rather than immediately on submit; catch it here too.
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "forgot-password.screen"
    timeout: 10000
- tapOn:
    id: "forgot-password.back-link"
- tapOn:
    id: "login.register-link"
- extendedWaitUntil:
    visible:
      id: "register.screen"
    timeout: 10000
- tapOn:
    id: "register.back-link"
# Correct login succeeds and leaves the login screen. Task 5 (coordinator
# resolution #1): ali@quran-review.com is now seeded with
# onboardingCompletedAt stamped (packages/server/src/prisma/seed-e2e.ts), so
# app/_layout.tsx's auth gate (F5) no longer redirects her to
# /onboarding/student — login lands directly on student home.
- runFlow:
    file: ../_helpers/login.yaml
    env:
      EMAIL: ali@quran-review.com
      PASSWORD: Student1234!
- extendedWaitUntil:
    notVisible:
      id: "login.screen"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 20000
