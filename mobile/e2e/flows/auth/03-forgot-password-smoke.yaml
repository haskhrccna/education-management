appId: com.quranreview.app
tags: [auth, smoke]
---
- clearKeychain
- launchApp:
    clearState: true
# Metro-reconnect/dev-launcher boilerplate factored out to _helpers/boot.yaml
# (shared with _helpers/login.yaml and 02-register-smoke.yaml).
- runFlow:
    file: ../_helpers/boot.yaml
# open forgot-password from login
- tapOn:
    id: "login.forgot-link"
- extendedWaitUntil:
    visible:
      id: "forgot-password.screen"
    timeout: 10000
# submit empty first. NOTE (deviation from the brief's literal "assert error
# state"): forgot-password.tsx has no client-side validation-error path for an
# empty email — handleSubmit early-returns on `!email.trim()`, and the submit
# button itself is `disabled` (and dimmed) while email is empty, so there is
# no error testID or error state to assert (confirmed: no `.error` testID on
# this screen per Task 3's inventory). The honest, real assertion available is
# that tapping the disabled control is a no-op: still on forgot-password.screen,
# nothing crashed or navigated.
- tapOn:
    id: "forgot-password.submit"
- assertVisible:
    id: "forgot-password.screen"
# fill email, submit
- tapOn:
    id: "forgot-password.email"
- inputText: "ali@quran-review.com"
- hideKeyboard
- tapOn:
    id: "forgot-password.submit"
# Success confirmation now carries a testID (forgot-password.success, added in
# review fix-pass) on the successCard container in forgot-password.tsx.
- extendedWaitUntil:
    visible:
      id: "forgot-password.success"
    timeout: 15000
