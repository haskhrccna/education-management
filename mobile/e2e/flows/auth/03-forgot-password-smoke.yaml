appId: com.quranreview.app
tags: [auth, smoke]
---
- clearKeychain
- launchApp:
    clearState: true
# Expo dev-client pitfall (see _helpers/login.yaml for the full explanation):
# reconnect to Metro and dismiss the dev-launcher's one-time explainer/menu.
- openLink: "com.quranreview.app://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: "login.email"
    timeout: 30000
# open forgot-password from login
- tapOn:
    id: "login.forgot-link"
- extendedWaitUntil:
    visible:
      id: "forgot-password.screen"
    timeout: 10000
# submit empty first. NOTE (deviation from the brief's literal "assert error
# state"): forgot-password.tsx has no client-side validation-error path for an
# empty email — handleSubmit early-returns on `!email.trim()`, and the submit
# button itself is `disabled` (and dimmed) while email is empty, so there is
# no error testID or error state to assert (confirmed: no `.error` testID on
# this screen per Task 3's inventory). The honest, real assertion available is
# that tapping the disabled control is a no-op: still on forgot-password.screen,
# nothing crashed or navigated.
- tapOn:
    id: "forgot-password.submit"
- assertVisible:
    id: "forgot-password.screen"
# fill email, submit
- tapOn:
    id: "forgot-password.email"
- inputText: "ali@quran-review.com"
- hideKeyboard
- tapOn:
    id: "forgot-password.submit"
# NOTE (deviation): the success confirmation ("If that email is registered...")
# has no testID either (successCard/successRow/successTitle in
# forgot-password.tsx are plain Views/Text, not in Task 3's testID inventory).
# Assert on the i18n copy itself — the only available signal that the request
# succeeded and the confirmation card rendered.
- extendedWaitUntil:
    visible:
      text: "إذا كان البريد مسجلاً، فقد تم إرسال رابط إعادة التعيين"
    timeout: 15000
