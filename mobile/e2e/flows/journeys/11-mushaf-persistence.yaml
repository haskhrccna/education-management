appId: com.quranreview.app
tags: [journey]
---
# Journey 11: student marks a mushaf page memorized -> the app is killed and
# relaunched WITHOUT clearing state -> the memorized marker is still shown,
# proving both (a) the status write really reached the server/DB (not just
# an optimistic local update) and (b) the authenticated session (Keychain
# token) survives a real cold process restart with no credentials re-entered
# at any point. The app's own post-relaunch UI lands directly on
# student-home.screen (see BUGLOG.md Task 10, RESOLVED): app/_layout.tsx's
# auth gate now redirects an already-authenticated, active, onboarded user
# off a public route (e.g. the transient login screen shown before
# loadSession() resolves) straight to their home screen, with no manual
# login step and no protected-deep-link workaround required.
#
# Unlike every other journey in this suite, this flow deliberately does NOT
# use clearKeychain/clearState anywhere - the whole point is a NON-destructive
# relaunch (`stopApp` + `launchApp` with no `clearState` key at all), per the
# coordinator's resolution #2. `PageMemorization` has a
# `@@unique([userId, page])` constraint (packages/server/prisma/schema.prisma)
# and `setPageStatus` is an upsert (mushafPages.service.ts), so - unlike
# Journey 2's appointment booking - this flow is also safely re-runnable
# back-to-back without a DB reset: re-marking the same page MEMORIZED again
# is idempotent, not a duplicate-guard collision.
#
# Page choice: start at the reader's default (page 1, no ?page= param) and
# tap `page-next` twice to reach page 3 - exercises the actual Touchable
# navigation controls per the brief's "navigate 2 pages forward", not just a
# deep-link parameter. The reader's on-screen page number
# ("{t('pageNumber')} {currentPage} / {TOTAL_PAGES}") has no testID (see
# Deviations in COVERAGE.md / the task report), so which page we landed on
# cannot be asserted directly - the determinism instead comes from
# `student-mushaf.page-next` being tapped exactly twice, deterministically
# starting from page 1, and from explicitly re-opening the SAME page 3 via
# `quran-review://student/mushaf?page=3` after the relaunch (the deep link
# supports a `page` query param already, per mushaf.tsx's
# useLocalSearchParams - this is not a new capability, just reused for
# determinism rather than relying on in-memory page position surviving a
# real process kill, which it does not: `currentPage` is component state,
# not persisted storage, so a cold relaunch always restarts the reader at
# whatever page the next deep link says).

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    file: ../_helpers/boot.yaml
- runFlow:
    file: ../_helpers/login.yaml
    env:
      EMAIL: ali@quran-review.com
      PASSWORD: Student1234!
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 20000

- openLink: "quran-review://student/mushaf"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "student-mushaf.screen"
    timeout: 10000

# Navigate 2 pages forward: page 1 -> 2 -> 3.
- tapOn:
    id: "student-mushaf.page-next"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: "student-mushaf.page-next"
- waitForAnimationToEnd:
    timeout: 1000

# Mark the current page (3) memorized via the status picker.
- tapOn:
    id: "student-mushaf.status-chip"
- extendedWaitUntil:
    visible:
      id: "student-mushaf.status-modal-sheet"
    timeout: 10000
- tapOn:
    id: "student-mushaf.mark-memorized"
# The onPress handler closes the modal synchronously and fires the status
# PUT asynchronously (setStatus(...).catch(() => {}), mushaf.tsx) - there is
# no on-screen "saved" signal to wait on. Give the (local, fast) API request
# a deliberate settle window before the app is killed below, so this flow
# doesn't race its own write and falsely appear to prove persistence of a
# request that never actually left the device.
- extendedWaitUntil:
    visible:
      id: "student-mushaf.status-chip"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000

# Kill and relaunch the app WITHOUT clearing state - no clearKeychain, no
# clearState. Session (Keychain token) and all local storage survive; only
# the in-memory JS runtime and its component state (including currentPage)
# are gone, same as a real user force-quitting and reopening the app.
- stopApp
- launchApp
# Defensive only: a plain (non-clearState) relaunch does not exhibit the
# dev-launcher Metro-forgetting behavior boot.yaml exists to work around
# (that's specifically a clearState side effect, per _helpers/boot.yaml's
# own comment) - these two taps are a no-op safety net in case any overlay
# happens to still be showing, not an expected step.
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true

# The app lands on student-home.screen directly after a bare relaunch - no
# protected-deep-link workaround needed. app/_layout.tsx's auth gate now has
# a fourth branch (added to fix the Task 10 BUGLOG finding): an already-
# authenticated, active, onboarded user sitting on a PUBLIC route (as this
# relaunch's cold start briefly is, before loadSession() resolves) is
# redirected to `/${role}/home`. This proves the fix end-to-end: the session
# (Keychain token) survives the real process kill AND the UI now correctly
# reflects it, with no manual login step required.
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 20000

# Re-open the SAME page (3) and confirm the memorized marker is still shown
# - a genuine round trip through the real API + DB, since the cold JS
# restart above discarded any in-memory/query-cache state; the label text
# now on screen can only have come from a fresh fetch of the persisted row.
- openLink: "quran-review://student/mushaf?page=3"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "student-mushaf.screen"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "student-mushaf.status-chip"
    timeout: 10000
# Content assertion, not just testID presence: student-mushaf.status-chip's
# testID is fixed regardless of status value (it's the same node whether
# NOT_STARTED/LEARNING/MEMORIZED/SOLID), so a bare assertVisible on the id
# alone would pass even if the status had reverted to NOT_STARTED.
#
# Two live-diagnosed issues before this worked (both documented in
# BUGLOG.md as new Task 10 findings):
# 1. student-mushaf.status-chip's TouchableOpacity had a STATIC
#    accessibilityLabel (t('pageStatus'), e.g. "Page status") that, on iOS,
#    collapses the whole subtree into one accessibility node carrying only
#    that static label - the nested AppText showing the actual dynamic
#    status word ("Memorized" etc) was never separately exposed to any
#    accessibility consumer, Maestro included, even though it's plainly
#    visible on screen (confirmed via a screenshot taken at the exact
#    moment the plain assertVisible below first failed). Fixed at the
#    source: mushaf.tsx's accessibilityLabel now interpolates the current
#    status (`${t('pageStatus')}: ${statusMeta(currentStatus).label}`) -
#    a real accessibility improvement (a VoiceOver user now actually hears
#    the current status), not just a test workaround.
# 2. Even after that fix, a bare `text: "محفوظة"` STILL failed - the
#    screen-hierarchy dump confirmed the chip's accessibility label was by
#    then correctly "حالة الصفحة: محفوظة" (containing our target string),
#    but Maestro's `text:` selector full-matches its pattern against the
#    ENTIRE accessible text (regex `matches`, not `contains`/`search`), so
#    a plain substring never matches a longer label. Fixed by wildcarding
#    the pattern instead of trying to assert the full compound label
#    (which would be equally correct but far more brittle, since it also
#    encodes the static "page status" translation - unrelated to what this
#    assertion is actually trying to prove).
- assertVisible:
    text: ".*محفوظة.*"

# DEVIATION (diagnosed live, no further fix attempted - see BUGLOG.md): this
# flow deliberately does NOT tap student-mushaf.back and assert a return to
# student-home.screen. mushaf.tsx has no BottomNav (per Task 7), so unlike
# every other student screen there is no route back to home that doesn't
# depend on router.back()'s own history stack - and that stack is corrupted
# by the SAME already-diagnosed bug #1 above (this task's mushaf?page=3 deep
# link was sent while the app's real underlying route was still
# login.screen, since nothing ever redirected it to home after the
# relaunch), so router.back() pops to login.screen, not student-home.screen
# - confirmed live via screenshot, exact same root-cause class already
# documented for reports.back in the Task 6 BUGLOG addendum ("wrong
# destination cascades into router.back()"). This is not a new defect to
# chase - it's a direct, mechanically-understood consequence of bug #1,
# and the flow's actual purpose (proving the memorized status survives a
# real cold restart) is already fully proven by the assertions above this
# point. The flow ends here rather than adding a misleading/confusing final
# step.
