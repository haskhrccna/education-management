appId: com.quranreview.app
tags: [journey]
---
# Journey 10: student views their streak -> teacher submits a fresh grade for
# them -> student re-logs-in and the streak screen reflects the new activity.
#
# grade.service.ts's createGrade now calls recordActivity() (Plan 1 findings
# fix-pass) - grading is wired into the streak the same way recording/
# revision/mushaf/ijazah/memorization/curriculum-plan actions already are.
# Ali has no seeded Streak row in either seed script, so before this flow's
# grade submission, getMyGamification zero-fills { currentStreak: 0,
# longestStreak: 0 }. After the grade submission, a Streak row now exists
# with currentStreak/longestStreak >= 1.
#
# student-gamification.streak-value (added alongside this fix) exposes the
# raw currentStreak number distinctly from student-gamification.streak (the
# metrics container View) - the final assertion below checks its text
# changed from "0" to "1" across the relaunch/role-switch/relaunch round
# trip, not just that the screen still renders. This also means, unlike
# Journey 2's appointment booking, this flow has NO duplicate-guard state to
# collide with on repeated bare re-runs (Grade has no unique constraint -
# see packages/server/prisma/schema.prisma) - though a same-UTC-day re-run
# won't increment currentStreak further past "1" (recordActivity's same-day
# rule), so the "1" assertion still holds on repeated same-day runs.
#
# Every `launchApp: clearState: true` here is preceded by `clearKeychain`,
# per Task 8's hard requirement (BUGLOG.md "Task 8 addendum 2") - iOS
# Keychain survives clearState alone and would otherwise leak the previous
# role's session into the next login.

# Part 1: student views their streak.
- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    file: ../_helpers/boot.yaml
- runFlow:
    file: ../_helpers/login.yaml
    env:
      EMAIL: ali@quran-review.com
      PASSWORD: Student1234!
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 20000
- openLink: "quran-review://student/gamification"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "student-gamification.screen"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "student-gamification.streak"
    timeout: 10000
- assertVisible:
    id: "student-gamification.streak-value"
    text: "0"

# Part 2: teacher submits a fresh grade for Ali. Reuses Journey 3's proven
# grade-form sequence (student auto-select, scroll-to-input keyboard-
# dismiss fix, type-chip pick, submit, dismiss the native success Alert) -
# see 03-grade-visibility.yaml for the full root-cause commentary on each
# step. A different grade value/type ("B" / ASSIGNMENT - GRADE_TYPES[1] in
# grade-form.tsx, type-chip.1) is used here purely to keep this journey's
# own DB footprint visually distinct from Journey 3's "A-"/QUIZ in manual
# inspection - not required for correctness, since Grade has no uniqueness
# constraint. Verified live against Postgres: a third grade row
# ('B'/ASSIGNMENT) now exists for ali alongside the two seeded rows
# ('A'/QUIZ, 'B+'/ASSIGNMENT).
- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    file: ../_helpers/boot.yaml
- runFlow:
    file: ../_helpers/login.yaml
    env:
      EMAIL: teacher@quran-review.com
      PASSWORD: Teacher1234!
- extendedWaitUntil:
    visible:
      id: "teacher-home.screen"
    timeout: 20000
- tapOn:
    id: "teacher-home.nav-grade-form"
- extendedWaitUntil:
    visible:
      id: "grade-form.screen"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "grade-form.student-select.0"
    timeout: 10000
- tapOn:
    id: "grade-form.student-select.0"
- scrollUntilVisible:
    element:
      id: "grade-form.grade-input"
    direction: DOWN
- tapOn:
    id: "grade-form.grade-input"
- inputText: "B"
- scrollUntilVisible:
    element:
      id: "grade-form.header"
    direction: UP
- tapOn:
    id: "grade-form.header"
- scrollUntilVisible:
    element:
      id: "grade-form.type-chip.1"
    direction: DOWN
- tapOn:
    id: "grade-form.type-chip.1"
- scrollUntilVisible:
    element:
      id: "grade-form.submit"
    direction: DOWN
- tapOn:
    id: "grade-form.submit"
- extendedWaitUntil:
    visible:
      text: "OK"
    timeout: 10000
- tapOn:
    text: "OK"
- extendedWaitUntil:
    visible:
      id: "teacher-home.screen"
    timeout: 10000

# Part 3: student re-logs-in; the streak screen reflects the grade write
# from Part 2 after the full relaunch/role-switch round trip.
- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    file: ../_helpers/boot.yaml
- runFlow:
    file: ../_helpers/login.yaml
    env:
      EMAIL: ali@quran-review.com
      PASSWORD: Student1234!
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 20000
- openLink: "quran-review://student/gamification"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "student-gamification.screen"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "student-gamification.streak"
    timeout: 10000
- assertVisible:
    id: "student-gamification.streak-value"
    text: "1"

- tapOn:
    id: "student-gamification.back"
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 10000
