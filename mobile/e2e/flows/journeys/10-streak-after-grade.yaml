appId: com.quranreview.app
tags: [journey]
---
# Journey 10: student views their streak -> teacher submits a fresh grade for
# them -> student re-logs-in and the streak screen still renders correctly.
#
# What this DOES prove: student-gamification.streak survives a full app
# relaunch + role switch + relaunch round trip (three clean cold starts),
# i.e. the screen is not left in some broken/stuck state by an unrelated
# write happening elsewhere in the app.
#
# What this does NOT (and per the coordinator's own resolution, cannot)
# prove: that submitting a grade CHANGES the streak's numeric value. It does
# not, and by design: streak.currentStreak/longestStreak come from the
# Streak table (gamification.service.ts's getMyGamification), which is only
# ever written by markStudentActiveToday() - and a repo-wide grep confirms
# that function is called from NOWHERE in the server's routes/controllers/
# services (only exercised directly by its own unit test,
# gamification.test.ts). Grade submission never touches the Streak table at
# all. So "streak still renders" is the correct and only true claim here -
# a content-based "the number changed" assertion would not just be brittle,
# it would be asserting something the app never does. Logged in BUGLOG.md as
# a new finding (orphaned streak-write path, same class as the pre-existing
# first-login.tsx finding).
#
# Ali has no seeded Streak row in either seed script (confirmed by Task 7),
# so the server's getMyGamification zero-fills { currentStreak: 0,
# longestStreak: 0 } rather than erroring - student-gamification.streak
# (the metrics container View, not a per-value testID) is therefore
# unconditionally visible on every login, before AND after this flow's grade
# submission. This also means, unlike Journey 2's appointment booking, this
# flow has NO duplicate-guard state to collide with on repeated bare re-runs
# (Grade has no unique constraint - see packages/server/prisma/schema.prisma)
# - safely re-runnable back-to-back without a DB reset.
#
# Every `launchApp: clearState: true` here is preceded by `clearKeychain`,
# per Task 8's hard requirement (BUGLOG.md "Task 8 addendum 2") - iOS
# Keychain survives clearState alone and would otherwise leak the previous
# role's session into the next login.

# Part 1: student views their streak.
- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    file: ../_helpers/boot.yaml
- runFlow:
    file: ../_helpers/login.yaml
    env:
      EMAIL: ali@quran-review.com
      PASSWORD: Student1234!
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 20000
- openLink: "quran-review://student/gamification"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "student-gamification.screen"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "student-gamification.streak"
    timeout: 10000

# Part 2: teacher submits a fresh grade for Ali. Reuses Journey 3's proven
# grade-form sequence (student auto-select, scroll-to-input keyboard-
# dismiss fix, type-chip pick, submit, dismiss the native success Alert) -
# see 03-grade-visibility.yaml for the full root-cause commentary on each
# step. A different grade value/type ("B" / ASSIGNMENT - GRADE_TYPES[1] in
# grade-form.tsx, type-chip.1) is used here purely to keep this journey's
# own DB footprint visually distinct from Journey 3's "A-"/QUIZ in manual
# inspection - not required for correctness, since Grade has no uniqueness
# constraint. Verified live against Postgres: a third grade row
# ('B'/ASSIGNMENT) now exists for ali alongside the two seeded rows
# ('A'/QUIZ, 'B+'/ASSIGNMENT).
- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    file: ../_helpers/boot.yaml
- runFlow:
    file: ../_helpers/login.yaml
    env:
      EMAIL: teacher@quran-review.com
      PASSWORD: Teacher1234!
- extendedWaitUntil:
    visible:
      id: "teacher-home.screen"
    timeout: 20000
- tapOn:
    id: "teacher-home.nav-grade-form"
- extendedWaitUntil:
    visible:
      id: "grade-form.screen"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "grade-form.student-select.0"
    timeout: 10000
- tapOn:
    id: "grade-form.student-select.0"
- scrollUntilVisible:
    element:
      id: "grade-form.grade-input"
    direction: DOWN
- tapOn:
    id: "grade-form.grade-input"
- inputText: "B"
- scrollUntilVisible:
    element:
      id: "grade-form.header"
    direction: UP
- tapOn:
    id: "grade-form.header"
- scrollUntilVisible:
    element:
      id: "grade-form.type-chip.1"
    direction: DOWN
- tapOn:
    id: "grade-form.type-chip.1"
- scrollUntilVisible:
    element:
      id: "grade-form.submit"
    direction: DOWN
- tapOn:
    id: "grade-form.submit"
- extendedWaitUntil:
    visible:
      text: "OK"
    timeout: 10000
- tapOn:
    text: "OK"
- extendedWaitUntil:
    visible:
      id: "teacher-home.screen"
    timeout: 10000

# Part 3: student re-logs-in; the streak screen still renders correctly
# after the unrelated grade write and the full relaunch/role-switch round
# trip.
- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    file: ../_helpers/boot.yaml
- runFlow:
    file: ../_helpers/login.yaml
    env:
      EMAIL: ali@quran-review.com
      PASSWORD: Student1234!
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 20000
- openLink: "quran-review://student/gamification"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "student-gamification.screen"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "student-gamification.streak"
    timeout: 10000

- tapOn:
    id: "student-gamification.back"
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 10000
