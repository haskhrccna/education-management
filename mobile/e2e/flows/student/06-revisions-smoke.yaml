appId: com.quranreview.app
tags: [student, smoke]
---
- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    file: ../_helpers/login.yaml
    env:
      EMAIL: ali@quran-review.com
      PASSWORD: Student1234!
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 20000

# quick-action.4 (revisions) was believed reliable through Task 5, but a live
# run during Task 6 closeout reproduced the same nondeterministic-navigation
# bug already logged for .2/.3 (BUGLOG.md Finding #3) on THIS tile too: the
# tap landed on student-appointments.screen (quick-action.0's destination)
# instead, confirmed via screenshot. Since there is no other reliable
# in-app path to this screen (grep confirms the quick-action tile is
# revisions.tsx's only route), reach it directly via deep link instead of
# fighting the buggy tap, so this flow can still exercise the SCREEN itself
# rather than re-litigating the already-logged navigation bug.
- openLink: "quran-review://student/revisions"
- extendedWaitUntil:
    visible:
      id: "student-revisions.screen"
    timeout: 10000

# Ali is seeded with 3 PENDING revision-schedule rows (packages/server/src/prisma/seed.ts).
- extendedWaitUntil:
    visible:
      id: "student-revisions.row.0"
    timeout: 10000

# Exercise mark-completed / mark-missed on row 0, but CANCEL the native
# confirm Alert both times rather than actually mutating the seeded PENDING
# row (no reset is run between iterations of this flow - see the hard
# restriction on `prisma migrate reset`).
- tapOn:
    id: "student-revisions.mark-completed.0"
- extendedWaitUntil:
    visible:
      text: "هل أنت متأكد؟"
    timeout: 10000
- tapOn:
    text: "إلغاء"

- tapOn:
    id: "student-revisions.mark-missed.0"
- extendedWaitUntil:
    visible:
      text: "هل أنت متأكد؟"
    timeout: 10000
- tapOn:
    text: "إلغاء"

# Row still PENDING (not mutated) after both cancels.
- extendedWaitUntil:
    visible:
      id: "student-revisions.mark-completed.0"
    timeout: 10000

- tapOn:
    id: "student-revisions.back"
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 10000
