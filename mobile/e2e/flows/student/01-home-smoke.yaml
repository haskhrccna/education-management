appId: com.quranreview.app
tags: [student, smoke]
---
- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    file: ../_helpers/login.yaml
    env:
      EMAIL: ali@quran-review.com
      PASSWORD: Student1234!
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 20000

# --- header icons: notifications / messages / account ---
- tapOn:
    id: "student-home.notifications"
- extendedWaitUntil:
    visible:
      id: "notifications.screen"
    timeout: 10000
- tapOn:
    id: "notifications.back"
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 10000

- tapOn:
    id: "student-home.messages"
- extendedWaitUntil:
    visible:
      id: "messages.screen"
    timeout: 10000
- tapOn:
    id: "messages.back"
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 10000

- tapOn:
    id: "student-home.account"
- extendedWaitUntil:
    visible:
      id: "account.screen"
    timeout: 10000
- tapOn:
    id: "account.back"
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 10000

# --- bottom nav round trip (appointments <-> home) ---
- tapOn:
    id: "bottom-nav.student-appointments"
- extendedWaitUntil:
    visible:
      id: "student-appointments.screen"
    timeout: 10000
- tapOn:
    id: "bottom-nav.student-home"
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 10000

# --- quick actions grid: student-home.quick-action.0..6 ---
#
# Plan 1 findings fix-pass (Task 4) ROOT-CAUSED the "quick-action tiles
# intermittently navigate to the WRONG destination" finding from Plan 1's
# BUGLOG.md. It is NOT an app bug in student-home.tsx - re-tested against a
# freshly restarted Metro (--clear) and a freshly erased iOS simulator using
# Maestro's testID-based tapOn (not raw coordinate taps), and the wrong
# destination reproduced 100% of the time (4/4) for any tile requiring an
# actual scroll (quick-action.4/.5/.6), both as the first navigation of a
# fresh session and chained after other navigations - deterministically
# landing on quick-action.0's destination every time, never a random tile.
#
# Root cause isolated via elimination: a single manual coordinate tap at the
# same on-screen position (via the simulator control tool, no Maestro
# involved) succeeded correctly; Maestro's own `tapOn` succeeded correctly
# when the preceding scroll was done manually outside Maestro; but Maestro's
# own `scrollUntilVisible` immediately followed by `tapOn` failed 100% of
# the time for any element requiring real scrolling - a `waitForAnimationToEnd`
# inserted between the two did not help. This is a Maestro `scrollUntilVisible`
# defect (this Maestro/XCUITest driver version's scroll-then-tap sequencing),
# not a defect a real user would ever hit. `quick-action.2`/`.3` sit above
# the fold and need no real scrolling, so `scrollUntilVisible` no-ops for
# them - re-tested clean 3/3 each under the exact old flow pattern that
# originally reproduced their failures, so coverage below was safely
# restored for them too. Their *original* Plan 1 failure is only
# indirectly, not conclusively, attributed to this same cause (see
# BUGLOG.md's Finding #3 for the full, hedged explanation) - it's not
# mechanistically explained the way .4/.5/.6's failures are, since neither
# needs a real scroll for the scrollUntilVisible race to apply.
#
# Fix: replace `scrollUntilVisible` with a plain `swipe` gesture before
# tapping any below-the-fold quick-action tile. Verified live: 100% correct
# destinations (11/11) across every below-the-fold control on this screen
# (quick-action.4/.5/.6, teacher-card, grades-view-all, mushaf-cta) using
# this pattern, replacing the old isolated-session/loose-assertion
# workaround entirely. All 7 tiles now get full tap->assert-destination->
# return coverage, matching .0/.1's original treatment.

# 0: session -> /student/appointments (has BottomNav)
- tapOn:
    id: "student-home.quick-action.0"
- extendedWaitUntil:
    visible:
      id: "student-appointments.screen"
    timeout: 10000
- tapOn:
    id: "bottom-nav.student-home"
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 10000

# 1: record -> /student/recordings (has BottomNav; no dedicated .screen
# testID yet - assert home is no longer visible, then return via the tab bar)
- tapOn:
    id: "student-home.quick-action.1"
- assertNotVisible:
    id: "student-home.screen"
- tapOn:
    id: "bottom-nav.student-home"
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 10000

# 2: grades -> /student/grades (has BottomNav; already visible above the
# fold, no scroll needed)
- tapOn:
    id: "student-home.quick-action.2"
- extendedWaitUntil:
    visible:
      id: "student-grades.screen"
    timeout: 10000
- tapOn:
    id: "bottom-nav.student-home"
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 10000

# 3: reports -> /student/reports (no BottomNav on this screen - return via
# its own back control; already visible above the fold, no scroll needed)
- tapOn:
    id: "student-home.quick-action.3"
- extendedWaitUntil:
    visible:
      id: "student-reports.screen"
    timeout: 10000
- tapOn:
    id: "reports.back"
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 10000

# 4: revisions -> /student/revisions (has BottomNav; below the fold - swipe,
# not scrollUntilVisible, per the root-cause note above)
- swipe:
    start: 50%, 75%
    end: 50%, 40%
- tapOn:
    id: "student-home.quick-action.4"
- extendedWaitUntil:
    visible:
      id: "student-revisions.screen"
    timeout: 10000
- tapOn:
    id: "bottom-nav.student-home"
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 10000

# 5: plans -> /student/plans (has BottomNav; below the fold)
- swipe:
    start: 50%, 75%
    end: 50%, 40%
- tapOn:
    id: "student-home.quick-action.5"
- extendedWaitUntil:
    visible:
      id: "student-plans.screen"
    timeout: 10000
- tapOn:
    id: "bottom-nav.student-home"
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 10000

# 6: ijazahs -> /student/ijazahs (has BottomNav). Sits alone in the grid's
# last row (7 tiles, 2 columns) - two swipes to reach it.
- swipe:
    start: 50%, 75%
    end: 50%, 40%
- swipe:
    start: 50%, 75%
    end: 50%, 40%
- tapOn:
    id: "student-home.quick-action.6"
- extendedWaitUntil:
    visible:
      id: "student-ijazahs.screen"
    timeout: 10000
- tapOn:
    id: "bottom-nav.student-home"
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 10000

# --- teacher card (ali has an assigned teacher -> routes to /messages) ---
- swipe:
    start: 50%, 75%
    end: 50%, 40%
- swipe:
    start: 50%, 75%
    end: 50%, 40%
- tapOn:
    id: "student-home.teacher-card"
- extendedWaitUntil:
    visible:
      id: "messages.screen"
    timeout: 10000
- tapOn:
    id: "messages.back"
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 10000

# --- recent grades "View all" action -> /student/grades ---
- swipe:
    start: 50%, 75%
    end: 50%, 40%
- swipe:
    start: 50%, 75%
    end: 50%, 40%
- tapOn:
    id: "student-home.grades-view-all"
- extendedWaitUntil:
    visible:
      id: "student-grades.screen"
    timeout: 10000
- tapOn:
    id: "bottom-nav.student-home"
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 10000

# --- mushaf CTA -> /student/mushaf (no BottomNav; tagged student-mushaf.back
# as of Task 7, renamed from the bare "mushaf.back" testID Task 5 left it
# with, to match the <screen>.<purpose> convention every other screen uses) ---
- swipe:
    start: 50%, 75%
    end: 50%, 40%
- swipe:
    start: 50%, 75%
    end: 50%, 40%
- swipe:
    start: 50%, 75%
    end: 50%, 40%
- tapOn:
    id: "student-home.mushaf-cta"
- assertNotVisible:
    id: "student-home.screen"
- tapOn:
    id: "student-mushaf.back"
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 10000
