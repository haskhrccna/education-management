appId: com.quranreview.app
tags: [student, smoke]
---
- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    file: ../_helpers/login.yaml
    env:
      EMAIL: ali@quran-review.com
      PASSWORD: Student1234!
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 20000
- tapOn:
    id: "bottom-nav.student-appointments"
- extendedWaitUntil:
    visible:
      id: "student-appointments.screen"
    timeout: 10000

# Ali is seeded with an ACCEPTED appointment with teacher@quran-review.com,
# which lands in the "history" (decided) list, row index 0.
- extendedWaitUntil:
    visible:
      id: "student-appointments.row.0"
    timeout: 10000

# Open the booking UI, assert the form renders, then cancel without
# submitting (booking itself is Journey 2 / a later task).
- tapOn:
    id: "student-appointments.book"
- extendedWaitUntil:
    visible:
      id: "student-appointments.book-form"
    timeout: 10000

# Exercise the date/time pickers by actually selecting a row (not just
# opening + dismissing) without submitting the form. scrollUntilVisible
# before each tap rather than relying on tapOn's own auto-scroll, which (per
# 01-home-smoke.yaml) doesn't reliably reach controls deep in a scrollable
# form/grid.
#
# Previously (BUGLOG.md, now RESOLVED) `date-option.N` / `time-option.N` rows
# were NOT individually reachable by id or text selector - iOS rolled the
# entire FlatList's ~90 rendered rows up into a single accessibility node on
# the `modalSheet` Pressable ancestor. Fixed by adding `accessible={false}` to
# both modal-sheet Pressables (mobile/app/student/appointments.tsx), the same
# pattern already shipped for admin/change-requests.tsx. Selecting row 0 now
# closes the sheet as a side effect of the component's own onPress handler.
- scrollUntilVisible:
    element:
      id: "student-appointments.date-select"
    direction: DOWN
- tapOn:
    id: "student-appointments.date-select"
- extendedWaitUntil:
    visible:
      id: "student-appointments.date-modal-sheet"
    timeout: 10000
- tapOn:
    id: "student-appointments.date-option.0"
- assertNotVisible:
    id: "student-appointments.date-modal-sheet"

- scrollUntilVisible:
    element:
      id: "student-appointments.time-select"
    direction: DOWN
- tapOn:
    id: "student-appointments.time-select"
- extendedWaitUntil:
    visible:
      id: "student-appointments.time-modal-sheet"
    timeout: 10000
- tapOn:
    id: "student-appointments.time-option.0"
- assertNotVisible:
    id: "student-appointments.time-modal-sheet"

# Duration chips
- scrollUntilVisible:
    element:
      id: "student-appointments.duration-chip.1"
    direction: DOWN
- tapOn:
    id: "student-appointments.duration-chip.1"
- tapOn:
    id: "student-appointments.duration-chip.2"
- tapOn:
    id: "student-appointments.duration-chip.0"

# Recurring toggle (on, then off, leaving the form in its default state)
- scrollUntilVisible:
    element:
      id: "student-appointments.recurring-toggle"
    direction: DOWN
- tapOn:
    id: "student-appointments.recurring-toggle"
- tapOn:
    id: "student-appointments.recurring-toggle"

# Cancel the form (the same toggle control, now showing "Cancel") without
# submitting.
- scrollUntilVisible:
    element:
      id: "student-appointments.book"
    direction: UP
- tapOn:
    id: "student-appointments.book"
- assertNotVisible:
    id: "student-appointments.book-form"

- tapOn:
    id: "student-appointments.back"
- extendedWaitUntil:
    visible:
      id: "student-home.screen"
    timeout: 10000
