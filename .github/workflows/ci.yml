name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: education_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository hygiene check
        run: npm run check:hygiene

      - name: Prisma generate
        run: npm exec --workspace=@quran-review/server -- prisma generate

      - name: Prettier check
        run: npx prettier --check "packages/server/src/**/*.ts"

      - name: Type check
        run: npm exec --workspace=@quran-review/server -- tsc --noEmit

      - name: Wait for PostgreSQL
        run: until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done

      - name: Prisma migrate
        run: npm exec --workspace=@quran-review/server -- prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/education_test?schema=public

      - name: Migration ledger drift check
        run: npm exec --workspace=@quran-review/server -- prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/education_test?schema=public

      - name: Run tests
        run: npm test --workspace=@quran-review/server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/education_test?schema=public
          JWT_SECRET: test-secret-key-for-ci-only-min-32-characters

      - name: Audit dependencies
        run: |
          node -e "
          const { execSync } = require('child_process');
          function tryExec(cmd) {
            try { return execSync(cmd, { maxBuffer: 1024 * 1024 * 20 }).toString(); }
            catch (err) { return (err.stdout || Buffer.from('')).toString(); }
          }
          const audit = JSON.parse(tryExec('npm audit --json'));
          // This is a shared-lockfile npm workspace: 'npm audit' reports findings
          // from the whole monorepo, including mobile's own (legitimate) Expo SDK
          // dependency, which this server process never loads at runtime. Findings
          // here are exempted only after manual confirmation they route solely
          // through the Expo/React Native toolchain (postcss is a CSS build-time
          // tool used by @expo/metro-config) — reviewed 2026-07-26. Re-review this
          // list whenever Expo SDK is upgraded past the versions on record here.
          //
          // brace-expansion (reviewed 2026-07-27): pinned to ^2.1.2 in the root
          // package.json "overrides" (patched for the classic ReDoS CVE) instead
          // of the newer 5.x line, because 5.x dropped the callable-function
          // export every 'minimatch' in this tree (including RN's own iOS codegen
          // toolchain) is written against — 5.x broke native iOS builds outright.
          // This reopens GHSA-mh99-v99m-4gvg (DoS via unbounded brace expansion,
          // fixed only at 5.0.8+, no backport to 1.x-4.x) on paper, but every
          // brace-expansion call site in this repo is local dev/build tooling
          // (jest, eslint, RN codegen, Expo CLI) processing developer-authored
          // glob patterns — never a server request path or the shipped app
          // bundle processing untrusted input. Re-review if brace-expansion ships
          // a 2.x/3.x/4.x patch, or if RN's codegen drops its old minimatch/glob
          // dependency and can take 5.x directly.
          const MOBILE_TOOLCHAIN_EXCEPTIONS = new Set(['postcss', 'brace-expansion']);
          // 2026-09-16: npm audit published new high-severity advisories for
          // build/test-toolchain packages. Each chain below was verified with
          // `npm ls <pkg>` to route ONLY through the Expo/React Native build
          // toolchain, the jest/ts-jest test toolchain, or the Prisma CLI —
          // never through code the API server loads at runtime:
          //   @expo/metro-config, metro-config, metro-transform-worker,
          //   image-size, fast-uri   -> mobile/ Expo/metro build toolchain
          //   js-yaml                 -> server: ts-jest -> babel-plugin-istanbul
          //                             -> @istanbuljs/load-nyc-config (tests only)
          //   deepmerge-ts            -> server: prisma CLI -> @prisma/config
          //                             (migration-time tooling, not @prisma/client)
          // Re-review this list whenever Expo SDK, Prisma, or jest is upgraded.
          const TOOLCHAIN_EXCEPTIONS = new Set([
            ...MOBILE_TOOLCHAIN_EXCEPTIONS,
            '@expo/metro-config', 'metro-config', 'metro-transform-worker',
            'image-size', 'fast-uri', 'js-yaml', 'deepmerge-ts',
          ]);
          const bad = Object.values(audit.vulnerabilities || {}).filter(
            (v) => (v.severity === 'high' || v.severity === 'critical') && !TOOLCHAIN_EXCEPTIONS.has(v.name)
          );
          if (bad.length) {
            console.error('High/critical vulnerabilities in the server\'s dependency surface:');
            for (const v of bad) console.error('- ' + v.name + ' (' + v.severity + ') range ' + v.range);
            process.exit(1);
          }
          console.log('OK — no high/critical vulnerabilities outside the reviewed Expo/React Native exceptions.');
          "

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quran_review_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm exec --workspace=@quran-review/server -- prisma generate

      - name: Integration tests
        run: npm exec --workspace=@quran-review/server -- jest -c jest.integration.config.js --runInBand
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/quran_review_test

  mobile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm exec --workspace=mobile -- tsc --noEmit

      - name: i18n completeness check
        run: npm run check-i18n --workspace=mobile

      - name: Route link check
        run: npm run check-routes --workspace=mobile

      - name: E2E testID coverage check
        run: npm run check:testids --workspace=mobile

      - name: Web export smoke (PWA + offline build)
        run: npm run build:web
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://api.placeholder.invalid/api/v1

  consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Frontend/backend URL consistency check
        env:
          WEB_API: ${{ vars.EXPO_PUBLIC_API_URL }}
          CLIENT: ${{ vars.CLIENT_URL }}
        run: |
          # The web export bakes EXPO_PUBLIC_API_URL into the bundle; the server
          # trusts only CLIENT_URL for CORS. If they drift, the deployed site
          # silently loses the ability to call the API. Fail CI on drift.
          if [ -z "$WEB_API" ] || [ -z "$CLIENT" ]; then
            echo "::warning::vars.EXPO_PUBLIC_API_URL and/or vars.CLIENT_URL unset — skipping check."
            exit 0
          fi
          web_origin="$(echo "$WEB_API" | sed -E 's#/api/v1/?$##')"
          if [ "$web_origin" != "$CLIENT" ]; then
            echo "::error::EXPO_PUBLIC_API_URL ($WEB_API) != CLIENT_URL ($CLIENT). The deployed web app would call an origin the server CORS does not trust."
            exit 1
          fi
          echo "OK — web API origin matches server CLIENT_URL."
