name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quran_review_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository hygiene check
        run: npm run check:hygiene

      - name: Prisma generate
        run: npm exec --workspace=@quran-review/server -- prisma generate

      - name: Prettier check
        run: npx prettier --check "packages/server/src/**/*.ts"

      - name: Type check
        run: npm exec --workspace=@quran-review/server -- tsc --noEmit

      - name: Wait for PostgreSQL
        run: until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done

      - name: Prisma migrate
        run: npm exec --workspace=@quran-review/server -- prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quran_review_test?schema=public

      - name: Migration ledger drift check
        run: npm exec --workspace=@quran-review/server -- prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quran_review_test?schema=public

      - name: Run tests
        run: npm test --workspace=@quran-review/server
        env:
          # One database for every suite. The unit job used to migrate
          # education_test on 5432 and then ignore it; integration used
          # quran_review_test on 5433. env.ts refuses anything else.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quran_review_test?schema=public
          JWT_SECRET: test-secret-key-for-ci-only-min-32-characters

      - name: Audit dependencies
        run: node scripts/ci-audit.js

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quran_review_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm exec --workspace=@quran-review/server -- prisma generate

      - name: Integration tests
        run: npm exec --workspace=@quran-review/server -- jest -c jest.integration.config.js --runInBand
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/quran_review_test

  mobile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm exec --workspace=mobile -- tsc --noEmit

      - name: i18n completeness check
        run: npm run check-i18n --workspace=mobile

      - name: Route link check
        run: npm run check-routes --workspace=mobile

      - name: E2E testID coverage check
        run: npm run check:testids --workspace=mobile

      - name: Web export smoke (PWA + offline build)
        run: npm run build:web
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://api.placeholder.invalid/api/v1

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — the scan must catch secrets introduced in old
          # commits, not just the current tree.
          fetch-depth: 0

      - name: Secret scan (gitleaks over full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
          GITLEAKS_VERSION: 8.30.1

  consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Frontend/backend URL consistency check
        env:
          WEB_API: ${{ vars.EXPO_PUBLIC_API_URL }}
          CLIENT: ${{ vars.CLIENT_URL }}
        run: |
          # The web export bakes EXPO_PUBLIC_API_URL into the bundle; the server
          # trusts only CLIENT_URL for CORS. If they drift, the deployed site
          # silently loses the ability to call the API. Fail CI on drift.
          # Half-configured is worse than unconfigured: it looks deployed and
          # fails at the first request. Only the both-unset case (a fresh fork,
          # or a repo whose API is not deployed yet) is allowed to skip — and
          # the Pages workflow refuses to publish in that state anyway.
          if [ -z "$WEB_API" ] && [ -z "$CLIENT" ]; then
            echo "::warning::vars.EXPO_PUBLIC_API_URL and vars.CLIENT_URL are both unset — no deployment to check. The Pages deploy will fail until EXPO_PUBLIC_API_URL is set."
            exit 0
          fi
          if [ -z "$WEB_API" ] || [ -z "$CLIENT" ]; then
            echo "::error::Only one of EXPO_PUBLIC_API_URL / CLIENT_URL is set. The web app would call an origin the server's CORS does not trust (or vice versa). Set both."
            exit 1
          fi
          # CLIENT_URL is the site's origin (what the server's CORS allows), not
          # the API's. The API lives on another host, so the two usually differ.
          # The Pages workflow checks CLIENT_URL against the real site origin.
          case "$WEB_API" in
            https://*/api/v1|https://*/api/v1/) ;;
            *) echo "::error::EXPO_PUBLIC_API_URL ($WEB_API) must be an https:// URL ending in /api/v1."; exit 1 ;;
          esac
          if ! printf '%s' "$CLIENT" | grep -Eq '^https://[^/]+/?$'; then
            echo "::error::CLIENT_URL ($CLIENT) must be a bare https:// origin (the site's scheme and host, no path), e.g. https://haskhrccna.github.io."
            exit 1
          fi
          echo "OK — API $WEB_API, site origin $CLIENT."
