name: Docker image (GHCR, multi-arch)

# Builds packages/server/Dockerfile for linux/amd64 + linux/arm64 and pushes
# to GHCR. The production stack (deploy/docker-compose.prod.yml) PULLS this
# image — the VM never builds. amd64 serves typical cloud VMs; arm64 serves
# Ampere instances (the Oracle free tier) and Apple-Silicon docker hosts.
#
#   main push   → ghcr.io/haskhrccna/education-management-api:latest + :sha-<short>
#   v* tag      → :v<tag> + :sha-<short>
#   manual      → :sha-<short>

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Keep in sync with deploy/docker-compose.prod.yml (api.image).
  IMAGE_NAME: ghcr.io/haskhrccna/education-management-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          tags="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            tags="$tags,${IMAGE_NAME}:latest"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tags="$tags,${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # npm ci layers cache across builds; arm64 first runs under QEMU and
          # is the slow leg — generous timeout.
          timeout: 45m
          cache-from: type=gha
          cache-to: type=gha,mode=max
