version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
    ports:
      - '4000:4000'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/quran_review?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - PORT=4000
      - ENABLE_WORKERS=true
      - CLIENT_URL=${CLIENT_URL:-}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL:-}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY:-}
      # S3-compatible media storage (MinIO container below; swap endpoint/creds for prod S3)
      - STORAGE_ENABLED=${STORAGE_ENABLED:-}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-minio}
      - STORAGE_PORT=${STORAGE_PORT:-9000}
      - STORAGE_USE_SSL=${STORAGE_USE_SSL:-false}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-minioadmin}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-minioadmin}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-quran-review-media}
      - STORAGE_PUBLIC_BASE_URL=${STORAGE_PUBLIC_BASE_URL:-}
      # The 604 Mushaf page images are ~51MB and are NOT in git or in the
      # image — they are mounted from the host (see DEPLOYMENT.md §12). The
      # server refuses to start in production without them; set
      # ALLOW_MISSING_MUSHAF_PAGES=1 to boot consciously without the reader.
      - MUSHAF_PAGES_DIR=/app/mushaf-pages
      - ALLOW_MISSING_MUSHAF_PAGES=${ALLOW_MISSING_MUSHAF_PAGES:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      - ./certificates:/app/certificates
      - ./mushaf-pages:/app/mushaf-pages
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=quran_review
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d quran_review']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    restart: unless-stopped

  # Local S3-compatible store for the shared media layer (POST /files/presign).
  # Production: point STORAGE_ENDPOINT at S3/R2 with TLS instead of running this.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${STORAGE_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
